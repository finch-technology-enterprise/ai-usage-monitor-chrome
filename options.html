<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Usage Monitor Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main>
    <h1>AI Usage Monitor</h1>
    <p class="intro">Personal settings stay in this Chrome profile. Toggle on the providers you subscribe to; the session-based ones use your existing browser sign-in, and only OpenCode needs a key.</p>

    <section>
      <h2>View</h2>
      <label for="viewMode">Default view mode (used by the toolbar button)</label>
      <select id="viewMode">
        <option value="window">Window — persistent popup</option>
        <option value="dismissable">Dismissable window — closes on click-away</option>
        <option value="tab">Tab — opens in a browser tab</option>
      </select>
      <p class="help">The switcher in the monitor window changes the view on the fly and becomes the new default.</p>
    </section>

    <div id="providerSettings"></div>

    <div class="actions">
      <button id="save" class="primary">Save</button>
      <span id="status"></span>
    </div>
  </main>
  <script src="providers.js"></script>
  <script src="providers/opencode.js"></script>
  <script src="providers/claude.js"></script>
  <script src="providers/chatgpt.js"></script>
  <script src="providers/copilot.js"></script>
  <script src="providers/gemini.js"></script>
  <script src="providers/cursor.js"></script>
  <script src="providers/perplexity.js"></script>
  <script src="providers/mistral.js"></script>
  <script src="providers/grok.js"></script>
  <script src="options.js"></script>
</body>
</html>
