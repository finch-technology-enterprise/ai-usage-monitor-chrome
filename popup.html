<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Usage Quota Monitor</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>AI Usage Quota Monitor</h1>
        <p id="updatedAt">Not refreshed yet</p>
      </div>
      <button id="refreshAll" class="icon-btn" title="Refresh all" aria-label="Refresh all">↻</button>
    </header>

    <div id="providers"></div>
    <div id="emptyState" class="empty" hidden>
      <p>No providers enabled.</p>
      <button id="emptySettings" class="small-btn">Open Settings</button>
    </div>

    <footer>
      <span id="privacyText">Local-only. No analytics.</span>
      <span class="footer-links">
        <button class="link-btn" data-open="about.html">About</button>
        <button id="settings" class="link-btn">Settings</button>
      </span>
    </footer>
  </main>
  <script src="providers.js"></script>
  <script src="providers/opencode.js"></script>
  <script src="providers/claude.js"></script>
  <script src="providers/chatgpt.js"></script>
  <script src="providers/copilot.js"></script>
  <script src="providers/gemini.js"></script>
  <script src="providers/cursor.js"></script>
  <script src="popup.js"></script>
</body>
</html>
